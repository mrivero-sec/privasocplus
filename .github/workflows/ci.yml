name: ci
on: [push, pull_request]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --no-banner --redact -v

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Vector (VRL sandbox for privasoc's parser tests)
        run: |
          curl -sSfL https://github.com/vectordotdev/vector/releases/download/v0.55.0/vector-0.55.0-x86_64-unknown-linux-musl.tar.gz | tar xz
          echo "PRIVASOC_VECTOR_BIN=$PWD/vector-x86_64-unknown-linux-musl/bin/vector" >> $GITHUB_ENV
      - run: uv sync --all-packages --locked
      - name: lint
        run: |
          uv run ruff check .
          (cd packages/privasoc && uv run ruff check . && uv run ruff format --check src tests)
          (cd packages/gateway && uv run ruff check . && uv run ruff format --check src tests)
      - name: privasoc
        working-directory: packages/privasoc
        run: uv run pytest -q
      - name: gateway
        working-directory: packages/gateway
        run: uv run pytest -q
      - name: gateway leak gate (no structured identifier may leave)
        working-directory: packages/gateway
        run: PYTHONPATH=src uv run python -m evals.leak_eval --threshold 0.0 --out evals/results/leak.json
      - name: contract between the two packages
        run: uv run pytest -q integration

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f packages/privasoc/Dockerfile -t privasoc .
      - run: docker build -t sovgate packages/gateway
